name: Release

# 推送 v* tag（npm run release）后：按 src/meta/changelog.json 里对应版本的更新内容创建 GitHub Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build release notes
        run: |
          node -e '
            const v = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const log = require("./src/meta/changelog.json");
            const e = log.find((x) => x.version === v);
            if (!e) { console.error("changelog.json 里没有 " + v); process.exit(1); }
            const sec = (title, list) => list && list.length ? `### ${title}\n\n${list.map((n) => "- " + n).join("\n")}\n` : "";
            const n = e.notes;
            const body = [
              sec("简体中文", n["zh-CN"]),
              sec("繁體中文", n["zh-TW"]),
              sec("English", n.en),
              sec("日本語", n.ja),
              "试玩 / Play: https://jjjj.games",
            ].filter(Boolean).join("\n");
            require("fs").writeFileSync("notes.md", body);
          '

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
