[package]
name = "desk-defense"
version = "0.1.0"
description = "书桌防线 Desk Defense — Tauri 桌面壳（加载 ../dist）"
authors = ["Desk Defense"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "desk_defense_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
